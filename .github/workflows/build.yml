name: Compilar y probar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.427
      - name: Restaurar
        run: dotnet restore Prometheus.V2.sln --locked-mode
      - name: Compilar
        run: dotnet build Prometheus.V2.sln -c Release --no-restore
      - name: Pruebas de lógica sin runtime multimedia ni IA
        run: ./Test.ps1 -Filter 'FullyQualifiedName~Prometheus.UnitTests.RationalTests.|FullyQualifiedName~Prometheus.UnitTests.TimelineTimecodeTests.|FullyQualifiedName~Prometheus.UnitTests.TimelineTests.|FullyQualifiedName~Prometheus.UnitTests.TimelineLinkedEditingTests.|FullyQualifiedName~Prometheus.UnitTests.TimelineGestureIntegrityTests.|FullyQualifiedName~Prometheus.UnitTests.RollEditSafetyTests.|FullyQualifiedName~Prometheus.UnitTests.TrackDeletionTests.|FullyQualifiedName~Prometheus.UnitTests.SequenceTransferTests.|FullyQualifiedName~Prometheus.UnitTests.SequenceOperationsTests.|FullyQualifiedName~Prometheus.UnitTests.AssetRemovalTests.|FullyQualifiedName~Prometheus.UnitTests.EditGroupTests.|FullyQualifiedName~Prometheus.UnitTests.MediaFolderTests.|FullyQualifiedName~Prometheus.UnitTests.MediaPoolOperationsTests.|FullyQualifiedName~Prometheus.UnitTests.FitClipSpeedTests.|FullyQualifiedName~Prometheus.UnitTests.LayoutTreeTests.|FullyQualifiedName~Prometheus.UnitTests.DockingLogicTests.|FullyQualifiedName~Prometheus.UnitTests.ProjectHistoryTests.|FullyQualifiedName~Prometheus.UnitTests.ProjectClipLookupTests.|FullyQualifiedName~Prometheus.UnitTests.MediaLabelPaletteTests.|FullyQualifiedName~Prometheus.UnitTests.MarkerTests.|FullyQualifiedName~Prometheus.UnitTests.PlaceholderTests.|FullyQualifiedName~Prometheus.UnitTests.PersistenceTests.|FullyQualifiedName~Prometheus.UnitTests.KeyframeAnimationTests.|FullyQualifiedName~Prometheus.UnitTests.InspectorModelTests.'
      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pruebas-windows
          path: TestResults
